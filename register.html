<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>



    <link rel="stylesheet" href="CSS/register.css">


</head>


<body>

<form action="">

<legend>Join us Today!</legend>
<br>


<label for="fullname">Fullname: </label>
<input type="text" id="fullname" placeholder="Enter your full name" required>
<br><br>



<label for="email address">Email Adress: </label>
<input type="email" id="email address" placeholder="Enter email" required>
<br><br>



<label for="password">Password: </label>
<input type="password" id="password" placeholder="Type your password" required>
<br><br>


<label for="phone">Phone Number: </label>
<input type="tel" id="phone" placeholder="0724567890" required>
<br><br>


<label for="dob">Date of Birth: </label>
<input type="date" id="dob" placeholder="Enter your full name" required>
<br><br>



<label for="dt">Date and Time: </label>
<input type="datetime" id="dt" placeholder="10/29/2026, 05:40 PM" required>
<br><br>



<label for="upload">Upload: </label>
<input type="file" id="upload" placeholder="upload" required>
<br><br>

<!---Dropdown-->

<!---RadioButton-->

<!---Checkbox-->

<!---Texarea-->



<button>Register</button>



</form>




    
</body>
</html>
